<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Recommendation System</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background: linear-gradient(90deg, #00f5ff 0%, #0d8f8f 100%) !important;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .navbar-brand {
            font-weight: bold;
            font-size: 1.5rem;
            color: white !important;
        }
        .nav-link {
            color: white !important;
            margin-left: 1.5rem;
            transition: 0.3s;
        }
        .nav-link:hover {
            color: #ffeb3b !important;
            text-shadow: 0 0 10px rgba(255, 235, 59, 0.5);
        }
        h1 {
            font-weight: bold;
            text-shadow: 0 0 20px rgba(0, 245, 255, 0.5);
            margin: 3rem 0 2rem 0;
        }
        .card {
            background: linear-gradient(135deg, #1a2f4a 0%, #243447 100%);
            border: 2px solid rgba(0, 245, 255, 0.3);
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
            height: 100%;
        }
        .card:hover {
            transform: translateY(-8px);
            border-color: #00f5ff;
            box-shadow: 0 8px 25px rgba(0, 245, 255, 0.3);
        }
        .card-img-top {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-bottom: 2px solid rgba(0, 245, 255, 0.2);
        }
        .card-body {
            padding: 15px;
        }
        .book-title {
            font-weight: bold;
            font-size: 0.95rem;
            color: #00f5ff;
            margin-bottom: 8px;
            line-height: 1.3;
        }
        .book-author {
            font-size: 0.85rem;
            color: #a8dadc;
            margin-bottom: 8px;
        }
        .book-stats {
            font-size: 0.8rem;
            color: #ffeb3b;
            margin: 5px 0;
        }
        .stats-label {
            color: #00f5ff;
            font-weight: 600;
        }
    </style>
    </head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand">📚 My Book Recommender</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/recommend">Recommendation</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row text-center">
            <div class="col-12">
                <h1>⭐ Top 50 Rated Books</h1>
            </div>
        </div>
        <div class="row g-4" style="padding: 20px;">
            {% for book in range(book_name|length) %}
                <div class="col-12 col-sm-6 col-md-4 col-lg-2">
                    <div class="card">
                        <img class="card-img-top" src="{{image[book]}}" alt="{{book_name[book]}}">
                        <div class="card-body">
                            <p class="book-title">{{book_name[book]}}</p>
                            <p class="book-author">by {{author[book]}}</p>
                            <hr style="border-color: rgba(0, 245, 255, 0.2);">
                            <p class="book-stats"><span class="stats-label">Rating:</span> {{rating[book]|round(2)}} ⭐</p>
                            <p class="book-stats"><span class="stats-label">Votes:</span> {{votes[book]}}</p>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
